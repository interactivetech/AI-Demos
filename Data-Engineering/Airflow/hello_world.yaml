# Data-Engineering/Airflow/hello_world.yaml
apiVersion: "sparkoperator.hpe.com/v1beta2"
kind: SparkApplication
metadata:
  # Use a unique name
  name: hello-world-{{ts_nodash|replace("T", "")}}
spec:
  # MUST be Python for mainApplicationFile to work this way
  type: Python
  # Use the same image version parameter for consistency, or hardcode
  sparkVersion: '{{dag_run.conf["spark_image_version"]}}'
  mode: cluster
  # Use the same image parameter, assumes the Spark image has Python
  image: '{{dag_run.conf["spark_image_url"]|default("", True)}}'
  imagePullPolicy: Always
  imagePullSecrets:
  - imagepull
  # ----> Point to the new script on the mounted volume <----
  mainApplicationFile: "local:///mounts/shared-volume/shared/ezua-tutorials/current-release/Data-Engineering/Airflow/scripts/hello_world.py" # Adjust path as needed!
  restartPolicy:
    type: Never
  # --- Driver Pod Configuration (This is what will run the script) ---
  driver:
    cores: 1
    coreLimit: "500m" # Reduced resources
    memory: "256m"  # Reduced resources
    labels:
      version: '{{dag_run.conf["spark_image_version"]}}'
    volumeMounts:
      - name: shared-volume
        mountPath: /mounts/shared-volume/shared # Mount the code
  # --- Executors: Probably not needed, but operator might create one anyway ---
  # Let's define it minimally or omit it. Omitting might be cleaner if it works.
  # If you omit the 'executor' block entirely, the operator might default
  # or might fail if it strictly expects it. Let's try defining 0 instances.
  executor:
    instances: 0 # Request zero executors explicitly
  # --- Volume Definition (Same as before) ---
  volumes:
    - name: shared-volume
      persistentVolumeClaim:
        claimName: kubeflow-shared-pvc # Assumes your hello_world.py is here